
import 'package:flutter/material.dart';

void main() {
  runApp(const MyApp());
}

class MyApp extends StatelessWidget {
  const MyApp({Key? key}) : super(key: key);

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Voice Chat App',
      theme: ThemeData.dark(),
      home: const VoiceCallScreen(),
    );
  }
}

class VoiceCallScreen extends StatefulWidget {
  const VoiceCallScreen({Key? key}) : super(key: key);

  @override
  State<VoiceCallScreen> createState() => _VoiceCallScreenState();
}

class _VoiceCallScreenState extends State<VoiceCallScreen> {
  double _volumeGain = 100;
  double _bassLevel = 0;
  bool _isMuted = false;
  bool _isSpeakerOn = true;
  String _selectedEffect = 'None';

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: const Color(0xFF121212),
      appBar: AppBar(
        title: const Text('Voice Chat & Equalizer'),
        backgroundColor: Colors.transparent,
        elevation: 0,
        centerTitle: true,
      ),
      body: SafeArea(
        child: Column(
          children: [
            const SizedBox(height: 20),
            
            // কলার প্রোফাইল
            const CircleAvatar(
              radius: 50,
              backgroundColor: Colors.blueAccent,
              child: Icon(Icons.person, size: 60, color: Colors.white),
            ),
            const SizedBox(height: 15),
            const Text(
              'A385 User',
              style: TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold),
            ),
            const SizedBox(height: 5),
            const Text(
              '02:45 • HD Voice (Echo Free)',
              style: TextStyle(color: Colors.greenAccent, fontSize: 14),
            ),

            const Spacer(),

            // সাউন্ড কন্ট্রোল প্যানেল
            Container(
              padding: const EdgeInsets.all(20),
              margin: const EdgeInsets.symmetric(horizontal: 16),
              decoration: BoxDecoration(
                color: const Color(0xFF1E1E1E),
                borderRadius: BorderRadius.circular(20),
                boxShadow: [
                  BoxShadow(color: Colors.black.withOpacity(0.5), blurRadius: 10)
                ],
              ),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Audio Enhancer Controls',
                    style: TextStyle(color: Colors.white70, fontWeight: FontWeight.bold),
                  ),
                  const Divider(color: Colors.white24),

                  // Gain Control
                  Row(
                    children: [
                      const Icon(Icons.volume_up, color: Colors.blueAccent),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Slider(
                          value: _volumeGain,
                          min: 0,
                          max: 400,
                          activeColor: Colors.blueAccent,
                          inactiveColor: Colors.white12,
                          onChanged: (value) {
                            setState(() {
                              _volumeGain = value;
                            });
                          },
                        ),
                      ),
                      Text('${_volumeGain.toInt()}%', style: const TextStyle(color: Colors.white)),
                    ],
                  ),

                  // Bass Boost Control
                  Row(
                    children: [
                      const Icon(Icons.graphic_eq, color: Colors.orangeAccent),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Slider(
                          value: _bassLevel,
                          min: -10,
                          max: 10,
                          activeColor: Colors.orangeAccent,
                          inactiveColor: Colors.white12,
                          onChanged: (value) {
                            setState(() {
                              _bassLevel = value;
                            });
                          },
                        ),
                      ),
                      Text('Bass: ${_bassLevel.toInt()}', style: const TextStyle(color: Colors.white)),
                    ],
                  ),

                  // Preset
                  Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      const Text('Voice Preset:', style: TextStyle(color: Colors.white)),
                      DropdownButton<String>(
                        value: _selectedEffect,
                        dropdownColor: const Color(0xFF2C2C2C),
                        style: const TextStyle(color: Colors.cyanAccent),
                        items: <String>['None', '3D Voice', 'Deep Bass', 'Clear Pitch']
                            .map((String value) {
                          return DropdownMenuItem<String>(
                            value: value,
                            child: Text(value),
                          );
                        }).toList(),
                        onChanged: (newValue) {
                          setState(() {
                            _selectedEffect = newValue!;
                          });
                        },
                      ),
                    ],
                  ),
                ],
              ),
            ),

            const SizedBox(height: 30),

            // কল বাটন
            Row(
              mainAxisAlignment: MainAxisAlignment.spaceEvenly,
              children: [
                IconButton(
                  iconSize: 32,
                  icon: Icon(_isMuted ? Icons.mic_off : Icons.mic),
                  color: _isMuted ? Colors.redAccent : Colors.white,
                  onPressed: () {
                    setState(() {
                      _isMuted = !_isMuted;
                    });
                  },
                ),
                FloatingActionButton(
                  backgroundColor: Colors.red,
                  onPressed: () {},
                  child: const Icon(Icons.call_end, color: Colors.white),
                ),
                IconButton(
                  iconSize: 32,
                  icon: Icon(_isSpeakerOn ? Icons.volume_up : Icons.volume_down),
                  color: _isSpeakerOn ? Colors.greenAccent : Colors.white,
                  onPressed: () {
                    setState(() {
                      _isSpeakerOn = !_isSpeakerOn;
                    });
                  },
                ),
              ],
            ),
            const SizedBox(height: 20),
          ],
        ),
      ),
    );
  }
}
